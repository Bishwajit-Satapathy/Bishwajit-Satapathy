<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Dark Wine to Burgundy Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10070C" />
      <stop offset="50%" stop-color="#190B12" />
      <stop offset="100%" stop-color="#2A0B18" />
    </linearGradient>

    <!-- Subtle Moving Light Beam -->
    <linearGradient id="glowSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0" />
      <stop offset="50%" stop-color="#C77B9B" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0" />
      <animate attributeName="x1" from="-100%" to="100%" dur="7s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0%" to="200%" dur="7s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Underline Glow Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701A3D" />
      <stop offset="50%" stop-color="#E5B5C7" />
      <stop offset="100%" stop-color="#701A3D" />
    </linearGradient>

    <!-- Technical Background Grid -->
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#451126" stroke-width="0.5" stroke-opacity="0.4" />
      <circle cx="0" cy="0" r="1" fill="#701A3D" fill-opacity="0.6" />
    </pattern>
  </defs>

  <!-- Container Base -->
  <rect width="900" height="240" rx="14" fill="url(#bgGrad)" />
  <rect width="900" height="240" rx="14" fill="url(#techGrid)" />

  <!-- Burgundy Outer Border -->
  <rect width="898" height="238" x="1" y="1" rx="13" fill="none" stroke="#701A3D" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Sweeping Ambient Light Beam -->
  <rect width="900" height="240" rx="14" fill="url(#glowSweep)" style="mix-blend-mode: screen;" />

  <!-- Left Accent Tech Bracket -->
  <path d="M 40 55 L 25 55 L 25 185 L 40 185" fill="none" stroke="#C77B9B" stroke-width="2" stroke-opacity="0.7" />

  <!-- Main Headline: Name -->
  <text x="60" y="95" fill="#F8F0F3" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="1.2">
    Bishwajit Satapathy
  </text>

  <!-- Animated Glowing Divider Line -->
  <rect x="60" y="112" width="580" height="2.5" rx="1" fill="url(#lineGrad)" />

  <!-- Subtitle: Role & Core Focus -->
  <text x="60" y="145" fill="#E5B5C7" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="2">
    ENTERPRISE SOLUTIONS  •  POWER PLATFORM  •  CYBERSECURITY
  </text>

  <!-- Status Indicator Badge -->
  <g transform="translate(60, 168)">
    <circle cx="6" cy="6" r="4" fill="#C77B9B">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <text x="20" y="10" fill="#C77B9B" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" letter-spacing="1">
      BUILDING SECURE, SCALABLE ARCHITECTURES
    </text>
  </g>
</svg>
