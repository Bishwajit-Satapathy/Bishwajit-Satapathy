<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <title>Bishwajit Satapathy - Developer Profile</title>
  <desc>Microsoft Power Platform Developer and Java Full Stack Developer.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10070C"/>
      <stop offset="45%" stop-color="#190B12"/>
      <stop offset="100%" stop-color="#240B18"/>
    </linearGradient>
    <linearGradient id="sweepLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C77B9B" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0"/>
      <animate attributeName="x1" from="-100%" to="100%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="0%" to="200%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701A3D"/>
      <stop offset="35%" stop-color="#E5B5C7"/>
      <stop offset="70%" stop-color="#C77B9B"/>
      <stop offset="100%" stop-color="#701A3D"/>
    </linearGradient>
    <pattern id="matrixGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0 L0 0 0 28" fill="none" stroke="#451126" stroke-width="0.5" stroke-opacity="0.35"/>
      <circle cx="0" cy="0" r="0.8" fill="#701A3D" fill-opacity="0.5"/>
    </pattern>
  </defs>
  <style>
    .font-name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 38px; font-weight: 800; fill: #F8F0F3; letter-spacing: 2px;
    }
    .font-role {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px; font-weight: 600; fill: #E5B5C7; letter-spacing: 1.1px;
    }
    .font-status {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 10px; font-weight: 500; fill: #C77B9B; letter-spacing: 0.5px;
    }
  </style>
  <rect width="920" height="280" rx="14" fill="url(#bgGrad)"/>
  <rect width="920" height="280" rx="14" fill="url(#matrixGrid)"/>
  <rect width="918" height="278" x="1" y="1" rx="13" fill="none" stroke="#451126" stroke-width="1.5"/>
  <rect width="920" height="280" rx="14" fill="url(#sweepLight)" style="mix-blend-mode:screen"/>
  <g transform="translate(760, 140)">
    <ellipse cx="0" cy="0" rx="75" ry="75" fill="none" stroke="#451126" stroke-width="1.2" stroke-dasharray="4,6"/>
    <ellipse cx="0" cy="0" rx="90" ry="35" fill="none" stroke="#701A3D" stroke-width="1.5" transform="rotate(-28)"/>
    <circle cx="0" cy="0" r="4.5" fill="#E5B5C7">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="3" fill="#C77B9B">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="75,0; -75,0; 75,0" dur="10s" additive="sum" repeatCount="indefinite"/>
    </circle>
  </g>
  <path d="M50 65 L35 65 L35 215 L50 215" fill="none" stroke="#701A3D" stroke-width="2" stroke-opacity="0.8"/>
  <text x="65" y="112" class="font-name">Bishwajit Satapathy</text>
  <rect x="65" y="130" width="560" height="2" rx="1" fill="url(#accentGlow)"/>
  <text x="65" y="165" class="font-role">MICROSOFT POWER PLATFORM DEVELOPER<tspan fill="#701A3D"> | </tspan>JAVA FULL STACK DEVELOPER</text>
  <g transform="translate(65, 195)">
    <circle cx="6" cy="6" r="4" fill="#C77B9B">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="22" y="10" class="font-status">Building business applications, automating workflows,</text>
    <text x="22" y="27" class="font-status">and developing scalable solutions.</text>
  </g>
</svg>
